[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "epub-cover-surgeon"
version = "0.1.0"
description = "A small CLI and Python library for extracting, replacing, inspecting, validating, and hardening EPUB covers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "EPUB Cover Surgeon contributors" }]
keywords = ["epub", "ebook", "cover", "publishing", "metadata", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "build>=1.2",
]

[project.scripts]
epub-cover = "epub_cover_surgeon.cli:main"
epub-cover-surgeon = "epub_cover_surgeon.cli:main"

[project.urls]
Homepage = "https://github.com/fortunatebooks/epub-cover-surgeon"
Source = "https://github.com/fortunatebooks/epub-cover-surgeon"
Issues = "https://github.com/fortunatebooks/epub-cover-surgeon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/epub_cover_surgeon"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
ignore = ["E501"]
