name: Feature request
description: Suggest an improvement for EPUB cover workflows.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What EPUB cover workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the tool do?
    validations:
      required: true
