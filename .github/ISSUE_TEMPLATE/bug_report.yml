name: Bug report
description: Report an EPUB cover extraction, replacement, validation, or CLI bug.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands and a minimized synthetic EPUB fixture if possible.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: epub-cover-surgeon 0.1.0, Python 3.12
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Do not attach private, copyrighted, or otherwise non-redistributable EPUBs to public issues.
